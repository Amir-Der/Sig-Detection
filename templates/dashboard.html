<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>تشخیص امضای جعلی</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="site-header">
    <h1>سامانه تشخیص امضای جعلی</h1>
    <p>پروژه‌ی دانش‌آموزی با هدف افزایش امنیت احراز هویت</p>
  </div>

  <div class="container">
    <div class="tab-buttons">
      <button class="tab active" onclick="showTab(event, 'upload-test')">آپلود برای تست</button>
      <button class="tab" onclick="showTab(event, 'upload-train')">آپلود برای آموزش</button>
    </div>

    <div class="tab-content" id="upload-test">
      <form id="test-form" method="POST" enctype="multipart/form-data">
        <input type="file" name="file" accept="image/*" required />
        <button type="submit">بررسی امضا</button>
        <div class="preview" id="preview-test"></div>
        <div class="result" id="result-test"></div>
      </form>
    </div>

    <div class="tab-content hidden" id="upload-train">
      <form id="train-form" method="POST" enctype="multipart/form-data">
        <label>آپلود ۱۰ امضای واقعی:</label>
        <input type="file" name="real_files" accept="image/*" multiple required>
        <label>آپلود ۱۰ امضای جعلی:</label>
        <input type="file" name="fake_files" accept="image/*" multiple required>
        <button type="submit">آموزش مدل</button>
        <div class="result" id="result-train"></div>
      </form>
    </div>
  </div>

  <script>
  document.getElementById('test-form').addEventListener('submit', async e => {
    e.preventDefault();
    const fileInput = document.querySelector('#test-form input[name="file"]');
    if (!fileInput.files.length) {
      document.getElementById('result-test').innerText = 'لطفاً یک فایل انتخاب کنید.';
      return;
    }
    const formData = new FormData();
    formData.append("file", fileInput.files[0]);
    const res = await fetch("/", { method: "POST", body: formData });
    const data = await res.json();
    document.getElementById('result-test').innerText = data.result;
  });
</script>

</body>
</html>
