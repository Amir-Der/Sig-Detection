<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تشخیص امضای جعلی</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="site-header">
    <h1>سامانه تشخیص امضای جعلی</h1>
    <p>پروژه‌ی دانش‌آموزی با هدف افزایش امنیت احراز هویت</p>
  </div>

  <div class="container">
    <div class="tab-buttons">
      <button class="tab active" onclick="showTab('upload-test')">آپلود برای تست</button>
      <button class="tab" onclick="showTab('upload-train')">آپلود برای آموزش</button>
    </div>

    <div class="tab-content" id="upload-test">
      <form id="test-form" method="POST" enctype="multipart/form-data">
        <input type="file" name="file" accept="image/*" required>
        <button type="submit">بررسی امضا</button>
        <div class="preview" id="preview-test"></div>
        <div class="result" id="result-test"></div>
      </form>
    </div>

    <div class="tab-content hidden" id="upload-train">
      <form id="train-form" method="POST" enctype="multipart/form-data">
        <label>آپلود ۱۰ امضای واقعی:</label>
        <input type="file" name="real_files" accept="image/*" multiple required>
        <label>آپلود ۱۰ امضای جعلی:</label>
        <input type="file" name="fake_files" accept="image/*" multiple required>
        <button type="submit">آموزش مدل</button>
        <div class="result" id="result-train"></div>
      </form>
    </div>
  </div>

  <div class="site-footer">
    <div class="footer-section">
      <h4>درباره پروژه</h4>
      <p>پروژه‌ی دانش‌آموزی با دقت بالا جهت تشخیص خودکار امضای جعلی</p>
    </div>
    <div class="footer-section">
      <h4>طراحی</h4>
      <p>توسط امیرمحمد درخشان و محمد بهرامگیری</p>
    </div>
  </div>

  <script>
    function showTab(id) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
    }

    document.getElementById('test-form').addEventListener('submit', async e => {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);
      const res = await fetch("/", { method: "POST", body: formData });
      const data = await res.json();
      document.getElementById('result-test').innerText = data.result;
    });

    document.getElementById('test-form').file.addEventListener('change', e => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = e => {
          document.getElementById('preview-test').innerHTML = `<img src="${e.target.result}" alt="پیش‌نمایش">`;
        };
        reader.readAsDataURL(file);
      }
    });
  </script>
</body>
</html>
